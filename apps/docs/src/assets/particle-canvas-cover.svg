<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Particle canvas component cover">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5ee" />
      <stop offset="1" stop-color="#d8e8dc" />
    </linearGradient>
    <linearGradient id="pc-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6b52" />
      <stop offset="1" stop-color="#173f33" />
    </linearGradient>
    <linearGradient id="pc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c795" />
      <stop offset="1" stop-color="#c99a5f" />
    </linearGradient>
    <filter id="pc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#123328" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#pc-bg)" />
  <circle cx="1030" cy="120" r="170" fill="#4f7f5b" opacity="0.08" />
  <circle cx="140" cy="650" r="190" fill="#4f7f5b" opacity="0.06" />

  <!-- 背景装饰卡片 -->
  <rect x="74" y="160" width="196" height="250" rx="20" fill="#fffaf3" opacity="0.78" />
  <rect x="930" y="150" width="196" height="260" rx="20" fill="#fffaf3" opacity="0.78" />
  <g fill="#241a14" opacity="0.1">
    <rect x="98" y="188" width="116" height="12" rx="6" />
    <rect x="98" y="212" width="146" height="8" rx="4" />
    <rect x="98" y="230" width="102" height="8" rx="4" />
    <rect x="954" y="178" width="104" height="12" rx="6" />
    <rect x="954" y="202" width="140" height="8" rx="4" />
    <rect x="954" y="220" width="92" height="8" rx="4" />
  </g>
  <g fill="#cf4a2b" opacity="0.42">
    <rect x="98" y="370" width="62" height="18" rx="9" />
    <rect x="954" y="370" width="54" height="18" rx="9" />
  </g>
  <rect x="110" y="442" width="150" height="120" rx="18" fill="#4f7f5b" opacity="0.12" />
  <rect x="940" y="452" width="150" height="118" rx="18" fill="url(#pc-gold)" opacity="0.24" />

  <!-- 星光 -->
  <g fill="url(#pc-gold)">
    <path d="M 320 210 L 324 222 L 336 226 L 324 230 L 320 242 L 316 230 L 304 226 L 316 222 Z" />
    <path d="M 868 540 L 871 549 L 880 552 L 871 555 L 868 564 L 865 555 L 856 552 L 865 549 Z" opacity="0.7" />
  </g>

  <!-- 画布外的悬浮卡片 -->
  <rect x="306" y="204" width="112" height="152" rx="18" fill="#4f7f5b" opacity="0.16" />
  <rect x="800" y="424" width="118" height="150" rx="18" fill="url(#pc-gold)" opacity="0.22" />

  <g filter="url(#pc-shadow)">
    <rect x="356" y="132" width="488" height="500" rx="30" fill="url(#pc-deep)" />

    <!-- 四角 HUD 标记 -->
    <g fill="none" stroke="#fffaf3" stroke-width="2" opacity="0.35" stroke-linecap="round">
      <path d="M 398 178 L 398 158 L 418 158" />
      <path d="M 782 158 L 802 158 L 802 178" />
      <path d="M 802 586 L 802 606 L 782 606" />
      <path d="M 418 606 L 398 606 L 398 586" />
    </g>

    <!-- 轨道与扫描线 -->
    <ellipse cx="600" cy="390" rx="192" ry="162" fill="none" stroke="#fffaf3" stroke-width="1.5" opacity="0.12" />
    <ellipse
      cx="600"
      cy="390"
      rx="150"
      ry="126"
      fill="none"
      stroke="#fffaf3"
      stroke-width="1.5"
      stroke-dasharray="6 10"
      opacity="0.14"
    />
    <line x1="392" y1="390" x2="808" y2="390" stroke="#fffaf3" stroke-width="1" opacity="0.08" />

    <!-- 粒子连线 -->
    <g stroke="#fffaf3" stroke-width="1.5" opacity="0.16">
      <path d="M 430 250 L 520 214" />
      <path d="M 520 214 L 704 236" />
      <path d="M 704 236 L 764 340" />
      <path d="M 764 340 L 692 484" />
      <path d="M 692 484 L 560 506" />
      <path d="M 560 506 L 486 556" />
      <path d="M 486 556 L 458 428" />
      <path d="M 458 428 L 558 366" />
      <path d="M 558 366 L 612 286" />
      <path d="M 612 286 L 520 214" />
      <path d="M 612 286 L 664 404" />
      <path d="M 664 404 L 558 366" />
      <path d="M 664 404 L 692 484" />
      <path d="M 404 344 L 458 428" />
      <path d="M 764 340 L 722 566" />
      <path d="M 722 566 L 692 484" />
    </g>

    <!-- 粒子 -->
    <circle cx="520" cy="214" r="22" fill="none" stroke="#fffaf3" stroke-width="1.5" opacity="0.18" />
    <circle cx="612" cy="286" r="18" fill="none" stroke="#cf4a2b" stroke-width="1.5" opacity="0.28" />
    <circle cx="430" cy="250" r="9" fill="url(#pc-gold)" />
    <circle cx="520" cy="214" r="13" fill="#fffaf3" opacity="0.9" />
    <circle cx="612" cy="286" r="10" fill="#cf4a2b" opacity="0.85" />
    <circle cx="704" cy="236" r="7" fill="url(#pc-gold)" opacity="0.9" />
    <circle cx="764" cy="340" r="12" fill="#a9c9bd" />
    <circle cx="664" cy="404" r="8" fill="#fffaf3" opacity="0.85" />
    <circle cx="558" cy="366" r="14" fill="#9fc4b7" />
    <circle cx="458" cy="428" r="6" fill="#cf4a2b" opacity="0.8" />
    <circle cx="560" cy="506" r="10" fill="url(#pc-gold)" />
    <circle cx="692" cy="484" r="7" fill="#a9c9bd" />
    <circle cx="722" cy="566" r="12" fill="#fffaf3" opacity="0.9" />
    <circle cx="486" cy="556" r="8" fill="#9fc4b7" opacity="0.9" />
    <circle cx="404" cy="344" r="6" fill="#fffaf3" opacity="0.7" />

    <!-- 零散微光 -->
    <circle cx="500" cy="180" r="3" fill="#fffaf3" opacity="0.5" />
    <circle cx="700" cy="320" r="3" fill="#fffaf3" opacity="0.45" />
    <circle cx="430" cy="500" r="3" fill="#fffaf3" opacity="0.4" />
    <circle cx="740" cy="520" r="3" fill="#fffaf3" opacity="0.45" />

    <!-- 顶部状态条 -->
    <rect x="384" y="158" width="54" height="20" rx="10" fill="#fffaf3" opacity="0.16" />
    <rect x="446" y="162" width="28" height="12" rx="6" fill="#fffaf3" opacity="0.1" />
    <circle cx="804" cy="168" r="7" fill="#cf4a2b" opacity="0.85" />
  </g>
</svg>
