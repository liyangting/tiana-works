<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Physics ball component cover">
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3f6" />
      <stop offset="1" stop-color="#d9e6ec" />
    </linearGradient>
    <linearGradient id="pb-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8fa2" />
      <stop offset="1" stop-color="#4a6b7d" />
    </linearGradient>
    <linearGradient id="pb-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3" />
      <stop offset="1" stop-color="#f2e4d2" />
    </linearGradient>
    <linearGradient id="pb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c795" />
      <stop offset="1" stop-color="#c99a5f" />
    </linearGradient>
    <filter id="pb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2c4653" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#pb-bg)" />
  <circle cx="1030" cy="120" r="170" fill="#5b7a8c" opacity="0.08" />
  <circle cx="140" cy="650" r="190" fill="#5b7a8c" opacity="0.06" />

  <!-- 背景装饰卡片 -->
  <rect x="74" y="160" width="196" height="250" rx="20" fill="#fffaf3" opacity="0.8" />
  <rect x="930" y="150" width="196" height="260" rx="20" fill="#fffaf3" opacity="0.8" />
  <g fill="#241a14" opacity="0.1">
    <rect x="98" y="188" width="116" height="12" rx="6" />
    <rect x="98" y="212" width="146" height="8" rx="4" />
    <rect x="98" y="230" width="102" height="8" rx="4" />
    <rect x="954" y="178" width="104" height="12" rx="6" />
    <rect x="954" y="202" width="140" height="8" rx="4" />
    <rect x="954" y="220" width="92" height="8" rx="4" />
  </g>
  <g fill="#cf4a2b" opacity="0.42">
    <rect x="98" y="370" width="62" height="18" rx="9" />
    <rect x="954" y="370" width="54" height="18" rx="9" />
  </g>
  <rect x="110" y="442" width="150" height="120" rx="18" fill="#5b7a8c" opacity="0.13" />
  <rect x="940" y="452" width="150" height="118" rx="18" fill="url(#pb-gold)" opacity="0.24" />

  <!-- 星光 -->
  <g fill="url(#pb-gold)">
    <path d="M 320 208 L 324 220 L 336 224 L 324 228 L 320 240 L 316 228 L 304 224 L 316 220 Z" />
    <path d="M 868 564 L 871 573 L 880 576 L 871 579 L 868 588 L 865 579 L 856 576 L 865 573 Z" opacity="0.7" />
  </g>

  <!-- 面板后的悬浮卡片 -->
  <rect x="300" y="330" width="98" height="138" rx="18" fill="#5b7a8c" opacity="0.16" />
  <rect x="814" y="226" width="100" height="142" rx="18" fill="url(#pb-gold)" opacity="0.22" />

  <g filter="url(#pb-shadow)">
    <rect x="336" y="142" width="528" height="466" rx="30" fill="url(#pb-cream)" />

    <!-- 顶部小状态条 -->
    <rect x="368" y="170" width="56" height="22" rx="11" fill="#5b7a8c" opacity="0.24" />
    <rect x="432" y="176" width="28" height="10" rx="5" fill="#241a14" opacity="0.1" />
    <circle cx="800" cy="181" r="7" fill="#cf4a2b" opacity="0.8" />

    <!-- 弹球轨迹 -->
    <g fill="none" stroke="#5b7a8c" stroke-width="2.5" stroke-linecap="round" opacity="0.38">
      <path d="M 420 228 Q 458 352 516 456" stroke-dasharray="8 9" />
      <path d="M 782 220 Q 736 336 698 448" stroke-dasharray="8 9" />
    </g>
    <circle cx="420" cy="228" r="8" fill="#fffaf3" stroke="#5b7a8c" stroke-width="2" opacity="0.8" />
    <circle cx="782" cy="220" r="7" fill="url(#pb-gold)" opacity="0.85" />
    <circle cx="456" cy="330" r="4" fill="#5b7a8c" opacity="0.4" />
    <circle cx="744" cy="316" r="4" fill="#5b7a8c" opacity="0.4" />

    <!-- 悬空弹球 -->
    <circle cx="600" cy="212" r="36" fill="none" stroke="#cf4a2b" stroke-width="1.5" stroke-dasharray="6 7" opacity="0.35" />
    <circle cx="600" cy="212" r="26" fill="#cf4a2b" />
    <path d="M 574 212 A 26 26 0 0 0 626 212 Z" fill="#241a14" opacity="0.08" />
    <circle cx="591" cy="202" r="8" fill="#fffaf3" opacity="0.6" />

    <!-- 容器 -->
    <rect x="386" y="300" width="428" height="244" rx="26" fill="#5b7a8c" opacity="0.06" />
    <path
      d="M 382 300 L 382 492 Q 382 540 430 540 L 770 540 Q 818 540 818 492 L 818 300"
      fill="none"
      stroke="url(#pb-accent)"
      stroke-width="9"
      stroke-linecap="round"
    />
    <ellipse cx="600" cy="548" rx="188" ry="14" fill="#5b7a8c" opacity="0.12" />

    <!-- 球体 -->
    <g>
      <circle cx="468" cy="506" r="32" fill="#cf4a2b" />
      <path d="M 436 506 A 32 32 0 0 0 500 506 Z" fill="#241a14" opacity="0.08" />
      <circle cx="457" cy="495" r="9" fill="#fffaf3" opacity="0.55" />
    </g>
    <g>
      <circle cx="538" cy="496" r="38" fill="#fffaf3" />
      <path d="M 500 496 A 38 38 0 0 0 576 496 Z" fill="#241a14" opacity="0.07" />
      <circle cx="525" cy="482" r="11" fill="#e8c795" opacity="0.55" />
    </g>
    <g>
      <circle cx="614" cy="506" r="34" fill="url(#pb-gold)" />
      <path d="M 580 506 A 34 34 0 0 0 648 506 Z" fill="#241a14" opacity="0.08" />
      <circle cx="602" cy="494" r="10" fill="#fffaf3" opacity="0.55" />
    </g>
    <g>
      <circle cx="688" cy="494" r="36" fill="#4f7f5b" />
      <path d="M 652 494 A 36 36 0 0 0 724 494 Z" fill="#241a14" opacity="0.1" />
      <circle cx="676" cy="481" r="10" fill="#fffaf3" opacity="0.45" />
    </g>
    <g>
      <circle cx="752" cy="514" r="28" fill="#6d78c8" />
      <path d="M 724 514 A 28 28 0 0 0 780 514 Z" fill="#241a14" opacity="0.08" />
      <circle cx="742" cy="504" r="8" fill="#fffaf3" opacity="0.5" />
    </g>

    <!-- 叠放小球 -->
    <g>
      <circle cx="582" cy="448" r="26" fill="#cdb28d" />
      <path d="M 556 448 A 26 26 0 0 0 608 448 Z" fill="#241a14" opacity="0.07" />
      <circle cx="573" cy="439" r="7" fill="#fffaf3" opacity="0.5" />
    </g>
    <g>
      <circle cx="654" cy="444" r="22" fill="#cf4a2b" opacity="0.9" />
      <circle cx="647" cy="437" r="6" fill="#fffaf3" opacity="0.5" />
    </g>

    <!-- 反弹速度线 -->
    <g stroke="#5b7a8c" stroke-width="3" stroke-linecap="round" opacity="0.28">
      <path d="M 430 560 L 462 560" />
      <path d="M 444 572 L 468 572" />
      <path d="M 742 560 L 774 560" />
      <path d="M 738 572 L 762 572" />
    </g>
  </g>
</svg>
