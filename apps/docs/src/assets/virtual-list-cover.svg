      <rect x="464" y="438" width="160" height="10" rx="5" fill="#241a14" opacity="0.12" />
      <rect x="464" y="456" width="104" height="7" rx="3.5" fill="#241a14" opacity="0.07" />
      <rect x="712" y="442" width="56" height="16" rx="8" fill="url(#vl-accent)" opacity="0.18" />
    </g>
    <g>
