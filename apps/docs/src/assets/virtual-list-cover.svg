<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Virtual list component cover">
  <defs>
    <linearGradient id="vl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0fb" />
      <stop offset="1" stop-color="#dfe4f7" />
    </linearGradient>
    <linearGradient id="vl-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b95de" />
      <stop offset="1" stop-color="#5f6bc0" />
    </linearGradient>
    <linearGradient id="vl-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3" />
      <stop offset="1" stop-color="#f2e4d2" />
    </linearGradient>
    <linearGradient id="vl-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c795" />
      <stop offset="1" stop-color="#c99a5f" />
    </linearGradient>
    <filter id="vl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3b3f66" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#vl-bg)" />
  <circle cx="1030" cy="120" r="170" fill="#6d78c8" opacity="0.07" />
  <circle cx="140" cy="650" r="190" fill="#6d78c8" opacity="0.05" />

  <!-- 背景装饰卡片 -->
  <rect x="74" y="160" width="196" height="250" rx="20" fill="#fffaf3" opacity="0.78" />
  <rect x="930" y="150" width="196" height="260" rx="20" fill="#fffaf3" opacity="0.78" />
  <g fill="#241a14" opacity="0.1">
    <rect x="98" y="188" width="116" height="12" rx="6" />
    <rect x="98" y="212" width="146" height="8" rx="4" />
    <rect x="98" y="230" width="102" height="8" rx="4" />
    <rect x="954" y="178" width="104" height="12" rx="6" />
    <rect x="954" y="202" width="140" height="8" rx="4" />
    <rect x="954" y="220" width="92" height="8" rx="4" />
  </g>
  <g fill="#cf4a2b" opacity="0.42">
    <rect x="98" y="370" width="62" height="18" rx="9" />
    <rect x="954" y="370" width="54" height="18" rx="9" />
  </g>
  <rect x="110" y="442" width="150" height="120" rx="18" fill="url(#vl-accent)" opacity="0.13" />
  <rect x="940" y="452" width="150" height="118" rx="18" fill="url(#vl-gold)" opacity="0.24" />

  <!-- 星光 -->
  <g fill="url(#vl-gold)">
    <path d="M 326 206 L 330 218 L 342 222 L 330 226 L 326 238 L 322 226 L 310 222 L 322 218 Z" />
    <path d="M 862 574 L 865 583 L 874 586 L 865 589 L 862 598 L 859 589 L 850 586 L 859 583 Z" opacity="0.7" />
  </g>

  <!-- 列表窗口 -->
  <rect x="330" y="190" width="104" height="148" rx="18" fill="url(#vl-accent)" opacity="0.18" />
  <rect x="766" y="436" width="104" height="140" rx="18" fill="url(#vl-accent)" opacity="0.12" />

  <g filter="url(#vl-shadow)">
