      <rect x="712" y="334" width="56" height="16" rx="8" fill="url(#vl-accent)" opacity="0.18" />
    </g>
    <g>
      <circle cx="436" cy="396" r="16" fill="#f0d9cc" />
      <rect x="464" y="384" width="136" height="10" rx="5" fill="#241a14" opacity="0.12" />
      <rect x="464" y="402" width="88" height="7" rx="3.5" fill="#241a14" opacity="0.07" />
      <rect x="712" y="388" width="48" height="16" rx="8" fill="url(#vl-accent)" opacity="0.18" />
    </g>
