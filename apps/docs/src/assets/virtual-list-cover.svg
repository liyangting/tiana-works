      <rect x="464" y="492" width="148" height="10" rx="5" fill="#241a14" opacity="0.12" />
      <rect x="464" y="510" width="96" height="7" rx="3.5" fill="#241a14" opacity="0.07" />
      <rect x="712" y="496" width="48" height="16" rx="8" fill="url(#vl-accent)" opacity="0.18" />
    </g>
    <g>
      <circle cx="436" cy="558" r="16" fill="#dfe3f7" />
      <rect x="464" y="546" width="156" height="10" rx="5" fill="#241a14" opacity="0.12" />
      <rect x="464" y="564" width="112" height="7" rx="3.5" fill="#241a14" opacity="0.07" />
      <rect x="712" y="550" width="56" height="16" rx="8" fill="url(#vl-accent)" opacity="0.18" />
    </g>

    <!-- 可视窗口高亮 -->
    <rect x="394" y="312" width="412" height="164" rx="18" fill="url(#vl-accent)" opacity="0.1" />
    <rect x="394" y="312" width="412" height="164" rx="18" fill="none" stroke="url(#vl-accent)" stroke-width="2" opacity="0.45" />
    <rect x="394" y="312" width="6" height="164" rx="3" fill="url(#vl-accent)" />

    <!-- 滚动条 -->
    <rect x="798" y="218" width="8" height="372" rx="4" fill="#241a14" opacity="0.08" />
