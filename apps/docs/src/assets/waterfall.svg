<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Waterfall component preview">
  <defs>
    <linearGradient id="wf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8efe2" />
      <stop offset="1" stop-color="#eedcc9" />
    </linearGradient>
    <linearGradient id="wf-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a07c" />
      <stop offset="1" stop-color="#cf4a2b" />
    </linearGradient>
    <linearGradient id="wf-sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6d3b6" />
      <stop offset="1" stop-color="#cdb28d" />
    </linearGradient>
    <linearGradient id="wf-clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b8a0" />
      <stop offset="1" stop-color="#b98563" />
    </linearGradient>
    <filter id="wf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a3a26" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#wf-bg)" />
  <circle cx="1010" cy="120" r="150" fill="#cf4a2b" opacity="0.08" />
  <circle cx="180" cy="640" r="180" fill="#cf4a2b" opacity="0.06" />

  <g filter="url(#wf-shadow)">
    <!-- column 1 -->
    <rect x="86" y="92" width="228" height="250" rx="20" fill="url(#wf-warm)" opacity="0.92" />
    <rect x="86" y="366" width="228" height="150" rx="20" fill="#fffaf3" />
    <rect x="86" y="540" width="228" height="126" rx="20" fill="url(#wf-sand)" opacity="0.9" />

    <!-- column 2 -->
    <rect x="344" y="92" width="228" height="160" rx="20" fill="#fffaf3" />
    <rect x="344" y="276" width="228" height="216" rx="20" fill="url(#wf-clay)" opacity="0.92" />
    <rect x="344" y="516" width="228" height="150" rx="20" fill="#fffaf3" />

    <!-- column 3 -->
    <rect x="602" y="92" width="228" height="212" rx="20" fill="url(#wf-sand)" opacity="0.92" />
    <rect x="602" y="328" width="228" height="128" rx="20" fill="url(#wf-warm)" opacity="0.85" />
    <rect x="602" y="480" width="228" height="186" rx="20" fill="#fffaf3" />

    <!-- column 4 -->
    <rect x="860" y="92" width="228" height="136" rx="20" fill="#fffaf3" />
    <rect x="860" y="252" width="228" height="246" rx="20" fill="url(#wf-clay)" opacity="0.9" />
    <rect x="860" y="522" width="228" height="144" rx="20" fill="url(#wf-warm)" opacity="0.8" />
  </g>

  <!-- card details -->
  <g fill="#ffffff" opacity="0.55">
    <rect x="112" y="120" width="120" height="12" rx="6" />
    <rect x="112" y="146" width="176" height="9" rx="4.5" />
    <rect x="112" y="166" width="150" height="9" rx="4.5" />
    <rect x="370" y="118" width="96" height="10" rx="5" />
    <rect x="370" y="140" width="150" height="8" rx="4" />
    <rect x="628" y="118" width="110" height="11" rx="5.5" />
    <rect x="628" y="142" width="168" height="8" rx="4" />
    <rect x="886" y="118" width="100" height="10" rx="5" />
    <rect x="886" y="140" width="156" height="8" rx="4" />
  </g>

  <g fill="#241a14" opacity="0.18">
    <rect x="112" y="392" width="140" height="10" rx="5" />
    <rect x="112" y="414" width="176" height="8" rx="4" />
    <rect x="112" y="566" width="150" height="8" rx="4" />
    <rect x="370" y="542" width="132" height="10" rx="5" />
    <rect x="370" y="564" width="170" height="8" rx="4" />
    <rect x="628" y="506" width="146" height="10" rx="5" />
    <rect x="628" y="528" width="180" height="8" rx="4" />
    <rect x="886" y="548" width="120" height="10" rx="5" />
  </g>

  <g fill="#cf4a2b" opacity="0.55">
    <rect x="112" y="438" width="58" height="18" rx="9" />
    <rect x="370" y="590" width="52" height="18" rx="9" />
    <rect x="628" y="552" width="64" height="18" rx="9" />
    <rect x="886" y="574" width="48" height="18" rx="9" />
  </g>
</svg>
